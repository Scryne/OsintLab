name: CI
on:
  push:
    branches: [master]
  pull_request:

# Uygulama yalnız Windows'ta çalışıyor (start.ps1, pythonw servisi, UNC/sürücü yolu testleri): CI de Windows'ta.
jobs:
  backend:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest
        env:
          PYTHONUTF8: "1"

  frontend:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      # next build PageProps/LayoutProps tiplerini .next/types altına üretir; tip denetimi ondan sonra
      - run: npm run build
      - run: npx tsc --noEmit
